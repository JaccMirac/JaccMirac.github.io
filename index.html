<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Übersicht</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    color: #1c2230;
    background: #faf7fc;
    font-size: 16px;
    line-height: 1.55;
    margin: 0;
    padding: 26px 18px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 4px 0;
    color: #6a2c8f;
    letter-spacing: .2px;
  }
  .sub { color: #5a6072; margin: 0; font-size: 1rem; }
  h2 {
    font-size: 1.05rem;
    color: #6a2c8f;
    margin: 26px 0 10px 0;
    padding-bottom: 4px;
    border-bottom: 1.5px solid #d9c4e6;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid #e6dcef;
    border-left: 4px solid #6a2c8f;
    border-radius: 6px;
    padding: 16px 18px;
    margin: 0 0 12px 0;
    transition: box-shadow .15s, transform .05s;
  }
  a.card:hover { box-shadow: 0 3px 10px rgba(106,44,143,.14); }
  a.card:active { transform: translateY(1px); }
  .card-title { font-weight: 600; font-size: 1.12rem; color: #2a2f3d; }
  .card-title .go { color: #6a2c8f; font-weight: 600; }
  .card-desc { color: #5a6072; font-size: .92rem; margin-top: 3px; }
  footer {
    margin-top: 32px;
    font-size: .82rem;
    color: #7a7f8c;
    border-top: 1px solid #e2e2ea;
    padding-top: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Übersicht</h1>
      <p class="sub">Bereiche &middot; tippen zum Öffnen</p>
    </header>

    <h2>Bereiche</h2>

    <a class="card" href="improv/">
      <div class="card-title">🎭 Improtheater-Sessions <span class="go">&rarr;</span></div>
      <div class="card-desc">120-Minuten-Sessions unter einem Überthema – fürs Handy gebaut.</div>
    </a>

    <footer>
      Interne Sammlung. Nicht für Suchmaschinen indexiert.
    </footer>
  </div>
</body>
</html>
